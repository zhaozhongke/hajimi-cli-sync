name: Build Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: false
        default: 'dev'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.site.key }} ${{ matrix.build.platform }} (${{ matrix.build.arch }})
    runs-on: ${{ matrix.build.os }}

    strategy:
      fail-fast: false
      matrix:
        site:
          - key: hajimi
            app_name: 哈基米 AI Switch
            asset_prefix: hajimi-switch
          - key: claude
            app_name: 克劳德 AI Switch
            asset_prefix: claude-switch
          - key: xuanji
            app_name: 玄机AI Switch
            asset_prefix: xuanji-switch
        build:
          - platform: windows
            os: windows-latest
            arch: x64
            target: x86_64-pc-windows-msvc
          - platform: macos
            os: macos-latest
            arch: x64
            target: x86_64-apple-darwin
          - platform: macos
            os: macos-latest
            arch: aarch64
            target: aarch64-apple-darwin
          - platform: linux
            os: ubuntu-22.04
            arch: x64
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.build.target }}

      - name: Install Linux dependencies
        if: matrix.build.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build application
        run: npm run tauri:build -- --site ${{ matrix.site.key }} --target ${{ matrix.build.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Ad-hoc sign macOS app (fixes Gatekeeper "damaged" error)
        if: matrix.build.platform == 'macos'
        run: |
          APP_PATH=$(find src-tauri/target/${{ matrix.build.target }}/release/bundle/macos -name "*.app" -maxdepth 1)
          if [ -n "$APP_PATH" ]; then
            echo "Signing $APP_PATH"
            codesign --force --deep --sign - "$APP_PATH"
            echo "Removing quarantine attribute"
            xattr -cr "$APP_PATH"
          fi

      - name: Re-create DMG with signed app
        if: matrix.build.platform == 'macos'
        run: |
          DMG_PATH=$(find src-tauri/target/${{ matrix.build.target }}/release/bundle/dmg -name "*.dmg" -maxdepth 1)
          APP_PATH=$(find src-tauri/target/${{ matrix.build.target }}/release/bundle/macos -name "*.app" -maxdepth 1)
          if [ -n "$DMG_PATH" ] && [ -n "$APP_PATH" ]; then
            DMG_DIR=$(dirname "$DMG_PATH")
            TEMP_DIR=$(mktemp -d)
            cp -R "$APP_PATH" "$TEMP_DIR/"
            ln -s /Applications "$TEMP_DIR/Applications"
            rm -f "$DMG_PATH"
            hdiutil create -volname "${{ matrix.site.app_name }}" -srcfolder "$TEMP_DIR" -ov -format UDZO "$DMG_PATH"
            rm -rf "$TEMP_DIR"
            echo "Re-created DMG: $DMG_PATH"
          fi

      - name: Rename release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          PREFIX="${{ matrix.site.asset_prefix }}"
          BUNDLE_ROOT="src-tauri/target/${{ matrix.build.target }}/release/bundle"

          case "${{ matrix.build.platform }}:${{ matrix.build.arch }}" in
            windows:x64)
              for file in "$BUNDLE_ROOT"/nsis/*.exe; do
                [ -e "$file" ] || continue
                mv "$file" "$(dirname "$file")/${PREFIX}_${VERSION}_x64-setup.exe"
              done
              for file in "$BUNDLE_ROOT"/msi/*.msi; do
                [ -e "$file" ] || continue
                mv "$file" "$(dirname "$file")/${PREFIX}_${VERSION}_x64_zh-CN.msi"
              done
              ;;
            macos:x64)
              for file in "$BUNDLE_ROOT"/dmg/*.dmg; do
                [ -e "$file" ] || continue
                mv "$file" "$(dirname "$file")/${PREFIX}_${VERSION}_x64.dmg"
              done
              ;;
            macos:aarch64)
              for file in "$BUNDLE_ROOT"/dmg/*.dmg; do
                [ -e "$file" ] || continue
                mv "$file" "$(dirname "$file")/${PREFIX}_${VERSION}_aarch64.dmg"
              done
              ;;
            linux:x64)
              for file in "$BUNDLE_ROOT"/appimage/*.AppImage; do
                [ -e "$file" ] || continue
                mv "$file" "$(dirname "$file")/${PREFIX}_${VERSION}_amd64.AppImage"
              done
              for file in "$BUNDLE_ROOT"/deb/*.deb; do
                [ -e "$file" ] || continue
                mv "$file" "$(dirname "$file")/${PREFIX}_${VERSION}_amd64.deb"
              done
              ;;
          esac

      - name: Upload Windows artifacts
        if: matrix.build.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: switch-${{ matrix.site.key }}-windows-${{ matrix.build.arch }}
          path: |
            src-tauri/target/${{ matrix.build.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.build.target }}/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload macOS artifacts
        if: matrix.build.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: switch-${{ matrix.site.key }}-macos-${{ matrix.build.arch }}
          path: |
            src-tauri/target/${{ matrix.build.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.build.target }}/release/bundle/macos/*.app
          if-no-files-found: warn

      - name: Upload Linux artifacts
        if: matrix.build.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: switch-${{ matrix.site.key }}-linux-${{ matrix.build.arch }}
          path: |
            src-tauri/target/${{ matrix.build.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.build.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: AI Switch ${{ github.ref_name }}
          draft: false
          make_latest: true
          generate_release_notes: true
          body: |
            ## Multi-site Installation / 三站独立安装包

            ### macOS
            1. Download the `.dmg` file for your site and architecture:
               - **Apple Silicon (M1/M2/M3/M4)**: `hajimi-switch_*_aarch64.dmg`, `claude-switch_*_aarch64.dmg`, `xuanji-switch_*_aarch64.dmg`
               - **Intel**: `hajimi-switch_*_x64.dmg`, `claude-switch_*_x64.dmg`, `xuanji-switch_*_x64.dmg`
            2. Open the `.dmg` file and drag the app to **Applications**
            3. If macOS shows "damaged" warning, run:
               ```bash
               xattr -cr "/Applications/<你的站点 Switch>.app"
               ```

            Or install via command line:
            ```bash
            DMG_FILE=$(ls *.dmg | head -n 1)
            hdiutil attach "$DMG_FILE"
            cp -R /Volumes/*/*.app /Applications/
            hdiutil detach "$(mount | awk '/\/Volumes\// {print $3; exit}')"
            ```

            ### Windows
            1. Download the `.msi` or `.exe` installer that matches your site
            2. Double-click to install and follow the setup wizard

            ### Linux
            **Debian/Ubuntu** (`.deb`):
            ```bash
            DEB_FILE=$(ls *.deb | head -n 1)
            sudo dpkg -i "$DEB_FILE"
            ```

            **AppImage**:
            ```bash
            APPIMAGE_FILE=$(ls *.AppImage | head -n 1)
            chmod +x "$APPIMAGE_FILE"
            "./$APPIMAGE_FILE"
            ```

            ---
          files: |
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 可选：自动发布到各平台的包管理器
  publish:
    name: Publish to Package Managers
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-beta') && !contains(github.ref, '-alpha')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish to Homebrew (macOS)
        run: |
          echo "TODO: 更新 Homebrew tap"
          # brew bump-formula-pr --url=... hajimi-cli-sync

      - name: Publish to Chocolatey (Windows)
        run: |
          echo "TODO: 发布到 Chocolatey"
          # choco push hajimi-cli-sync.nupkg

      - name: Publish to AUR (Arch Linux)
        run: |
          echo "TODO: 更新 AUR PKGBUILD"
